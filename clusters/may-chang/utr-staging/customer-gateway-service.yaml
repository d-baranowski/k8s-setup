apiVersion: v1
kind: Service
metadata:
  name: utr-staging-customer-gateway
  namespace: default
  labels:
    app: utr-staging-customer-gateway
spec:
  type: ClusterIP
  ports:
  - port: 9998
    targetPort: 9998
    protocol: TCP
    name: api
  - port: 18008
    targetPort: 18008
    protocol: TCP
    name: health
  selector:
    app: utr-staging-customer-gateway
