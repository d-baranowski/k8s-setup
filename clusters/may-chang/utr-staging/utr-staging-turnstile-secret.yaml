# Server-side Turnstile secret for the customer gateway's siteverify call. The
# matching site key is public and is baked into the customer-ui bundle by the
# Jenkins build, so only this half needs to be a secret.
#
# The widget is created by infra/cloudflare/turnstile.tf; push its secret into
# Google Secret Manager under the key below before this resolves.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: utr-staging-turnstile
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: utr-staging-turnstile
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: TURNSTILE_SECRET
      remoteRef:
        key: utro-customer-turnstile-staging-secret
        version: latest
