apiVersion: v1
kind: Service
metadata:
  name: utr-staging-api-gateway
  namespace: default
  labels:
    app: utr-staging-api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 9997
    targetPort: 9997
    protocol: TCP
    name: api
  - port: 18013
    targetPort: 18013
    protocol: TCP
    name: health
  selector:
    app: utr-staging-api-gateway
