apiVersion: v1
kind: Service
metadata:
  name: utr-staging-assets
  namespace: default
spec:
  selector:
    app: utr-staging-assets
  ports:
  - port: 9003
    targetPort: api
    protocol: TCP
    name: api
  - port: 18007
    targetPort: 18007
    protocol: TCP
    name: health
  type: ClusterIP
