# The secret the admin UI's server presents to the admin gateway (UTR-000892).
# The gateway believes X-User-Id only from a caller holding it; both ui and
# gateway read it. Generated into Google Secret Manager by
# infra/utro/gateway-bff-secret.tf.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: utr-staging-gateway-bff
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: utr-staging-gateway-bff
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GATEWAY_BFF_SECRET
      remoteRef:
        key: utro-gateway-bff-staging-secret
        version: latest
