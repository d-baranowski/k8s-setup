apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: pg-staging-cluster
  namespace: default
spec:
  teamId: "inspiration-particle"
  numberOfInstances: 1

  postgresql:
    version: "15"
    parameters:
      shared_preload_libraries: "pg_cron"
      cron.database_name: "utr_staging"
      # pg_cron has to run its jobs in a background worker, because it cannot
      # authenticate as anything else.
      #
      # With this off (the default), pg_cron runs each job by opening a real
      # libpq connection to cron.host (localhost) as the job's role — and the
      # patroni.pg_hba block below replaced Spilo's defaults with md5 on every
      # host line. pg_cron has no password to offer, so every run is refused.
      # It does not warn, disable the job or back off; it retries every minute
      # forever. core.clear_expired_user_locks() failed 616,864 times on
      # pg-staging-cluster between 2026-06-04 and 2026-09-19 and succeeded
      # exactly never, which reads in cron.job_run_details as a job that is
      # scheduled and running.
      #
      # `on` drops the connection entirely: the job runs in a background worker
      # as its owning role, with no authentication in the path, so the pg_hba
      # block stops being able to silently disable cron. Postmaster-context
      # GUC, so it takes a Postgres restart to apply.
      cron.use_background_workers: "on"
      # Logical replication for the core-event CDC service (publication
      # core_event_pub, slot core_event_slot via pgoutput). Mirrors the dev
      # postgres settings in utro/docker-compose.yml. Changing wal_level
      # forces a Postgres restart on the next operator reconcile.
      wal_level: "logical"
      max_wal_senders: "10"
      max_replication_slots: "10"

  patroni:
    pg_hba:
      # local (unix socket)
      - "local   all             postgres                                md5"
      - "local   all             utr_staging_user                        md5"
      - "local   all             utr_staging_migrator                    md5"
      - "local   all             core_event                              md5"

      # ANY host, no-SSL explicitly allowed (matches: no encryption)
      - "hostnossl all           postgres             0.0.0.0/0          md5"
      - "hostnossl all           utr_staging_user     0.0.0.0/0          md5"
      - "hostnossl all           utr_staging_migrator 0.0.0.0/0          md5"
      - "hostnossl all           core_event           0.0.0.0/0          md5"
      - "hostnossl all           postgres             ::/0               md5"
      - "hostnossl all           utr_staging_user     ::/0               md5"
      - "hostnossl all           utr_staging_migrator ::/0               md5"
      - "hostnossl all           core_event           ::/0               md5"

      # ANY host, SSL also allowed
      - "hostssl all             postgres             0.0.0.0/0          md5"
      - "hostssl all             utr_staging_user     0.0.0.0/0          md5"
      - "hostssl all             utr_staging_migrator 0.0.0.0/0          md5"
      - "hostssl all             core_event           0.0.0.0/0          md5"
      - "hostssl all             postgres             ::/0               md5"
      - "hostssl all             utr_staging_user     ::/0               md5"
      - "hostssl all             utr_staging_migrator ::/0               md5"
      - "hostssl all             core_event           ::/0               md5"

  # WHAT THE DATABASE IS ALLOWED TO USE, stated here rather than inherited — the
  # same fix pg-op-cluster got in cluster.yaml, which this cluster never received.
  #
  # On the operator's defaults (100Mi requested, 500Mi limit) it sat at ~496Mi
  # and was OOMKilled 8–9 times a day from 2026-09-22, up from once a day before
  # 09-19; ten days earlier its working set was ~167Mi. Each kill is a short
  # staging outage, and one of them failed pg-cron-healthcheck on DNS alone.
  #
  # 2Gi limit, 768Mi requested — the request sits above the ~500Mi it already
  # holds, and the limit matches prod so it has real room to breathe. Usage was
  # flat against the old limit, so there is no honest high-water mark to size
  # from yet: read container_memory_max_usage_bytes after a week under this one
  # and tighten it then. Applying it restarts the pod once.
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 2Gi

  volume:
    size: 10Gi

  # No enableLogicalBackup and no WAL_S3_BUCKET env: this cluster is
  # intentionally excluded from S3 backups (staging data).

  users:
    utr_staging_user: [CREATEROLE]
    utr_staging_migrator: [BYPASSRLS, CREATEROLE]
    # Dedicated CDC role for core-event: REPLICATION to own the logical slot,
    # BYPASSRLS to read the FORCE-RLS core tables its transformers enrich from.
    # Table/pgmq grants are applied by the bootstrap service (core_event_grants).
    # Name is env-agnostic so the same manifest carries to prod.
    core_event: [LOGIN, REPLICATION, BYPASSRLS]

  databases:
    utr_staging: utr_staging_migrator
