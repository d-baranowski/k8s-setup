# Postgres extensions for utr_staging, stated here rather than left to whoever
# ran psql last.
#
# The set is the one utro's dev database gets from
# utro/docker/postgres/initdb.d/00001.sql at first boot, plus unaccent, which
# the core migration 20260917170000_search_configuration.sql creates. Dev gets
# them free; the operator-managed clusters got them one at a time, by hand,
# which is how staging ended up without pg_trgm and prod without pg_cron. A
# missing trigram extension is not a missing feature — it is a migration that
# fails on `create index ... using gin (... gin_trgm_ops)` and a search that is
# down until someone connects as superuser.
#
# Every statement is `if not exists`, so the Job is a no-op wherever the
# extension is already there and the file can stay as the record of the full
# intended set. It re-runs whenever this template changes
# (kustomize.toolkit.fluxcd.io/force), and a restored or rebuilt cluster gets
# the extensions back without anyone remembering this list.
#
# Runs as `postgres`: pg_cron and pg_partman are not trusted extensions, so
# utr_staging_migrator cannot create them however much it owns the database.
apiVersion: batch/v1
kind: Job
metadata:
  name: utr-staging-db-extensions
  namespace: default
  labels:
    app: utr-staging-db-extensions
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: utr-staging-db-extensions
    spec:
      restartPolicy: OnFailure
      containers:
      - name: extensions
        image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
        env:
        - name: PGHOST
          value: "pg-staging-cluster.default.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "utr_staging"
        - name: PGSSLMODE
          value: "require"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres.pg-staging-cluster.credentials.postgresql.acid.zalan.do
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres.pg-staging-cluster.credentials.postgresql.acid.zalan.do
              key: password
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- pg_partman lives in its own schema in dev and in both operator
          -- clusters; keep it there rather than letting it land in public.
          create schema if not exists partman;

          create extension if not exists btree_gist;
          create extension if not exists pg_partman with schema partman;
          create extension if not exists pg_cron;
          create extension if not exists pgcrypto;
          create extension if not exists pg_trgm;
          create extension if not exists unaccent;

          -- `create extension if not exists` succeeds quietly when the
          -- extension is missing from the image as well as from the database,
          -- so state what the database must end up with and fail on it.
          do $$
          declare missing text;
          begin
            select string_agg(x, ', ' order by x) into missing
            from unnest(array['btree_gist','pg_cron','pg_partman',
                              'pgcrypto','pg_trgm','unaccent']) x
            where not exists (select 1 from pg_extension where extname = x);
            if missing is not null then
              raise exception 'extensions still missing after create: %', missing;
            end if;
          end $$;

          \echo 'installed extensions:'
          SQL
          psql -v ON_ERROR_STOP=1 -c "\dx"
