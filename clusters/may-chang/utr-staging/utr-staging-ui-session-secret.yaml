# The key the admin UI signs and verifies its session cookie with (UTR-000924).
# Without it the UI refuses every sign-in, so create it before this rolls out:
#   openssl rand -base64 48 | tr -d '\n' | gcloud secrets create utr-staging-ui-jwt-secret --data-file=-
# Rotating it signs every admin out.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: utr-staging-ui-session
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: utr-staging-ui-session
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: utr-staging-ui-jwt-secret
        version: latest
