# The public API for external tooling (UTR-000890): bearer API tokens only. No
# client-supplied identity header is believed here; the token is resolved by
# core's ApiTokenAuthService and narrows every request to its grants.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: utr-staging-api-gateway
  namespace: default
  labels:
    app: utr-staging-api-gateway
spec:
  serviceName: utr-staging-api-gateway
  replicas: 1
  selector:
    matchLabels:
      app: utr-staging-api-gateway
  template:
    metadata:
      labels:
        app: utr-staging-api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/inspiration-particle/utro-api-gateway:0.1.140 # {"$imagepolicy": "flux-system:utr-staging-api-gateway"}
        ports:
        - containerPort: 9997
          name: api
        - containerPort: 18013
          name: health
        env:
        - name: TIMEZONE
          value: "Europe/Warsaw"
        - name: HEALTH_PORT
          value: "18013"
        - name: API_PORT
          value: "9997"
        - name: LOG_LEVEL
          value: "debug"
        - name: SERVICE_NAME
          value: "rpg.api-gateway"
        - name: SERVICE_ENV
          value: "staging"
        - name: SERVICE_VERSION
          value: "0.1.140" # {"$imagepolicy": "flux-system:utr-staging-api-gateway:tag"}
        # Bare host:port: pkg/gateway folds these into url.URL.Host.
        - name: CORE_SERVICE
          value: "utr-staging-core.default.svc.cluster.local:9102"
        - name: PAYMENT_SERVICE
          value: "utr-staging-payment.default.svc.cluster.local:9102"
        - name: NOTIFICATION_SERVICE
          value: "utr-staging-notification.default.svc.cluster.local:9002"
        - name: ASSETS_SERVICE
          value: "utr-staging-assets.default.svc.cluster.local:9003"
        - name: WITH_PERMISSIONS
          value: "true"
        - name: ENABLE_PERMISSIONS
          value: "true"
        - name: RPG_PERMISSIONS_FLAG
          value: "true"
        # Per IP before authentication, per token after. The IP allowance is
        # above the token's because one integration host may run several.
        - name: API_RATE_LIMIT_ENABLED
          value: "true"
        - name: API_RATE_LIMIT_PER_IP
          value: "1200"
        - name: API_RATE_LIMIT_PER_TOKEN
          value: "600"
        - name: API_RATE_LIMIT_WINDOW_SECONDS
          value: "60"
        - name: API_MAX_BODY_BYTES
          value: "1048576"
        - name: TR_ENABLED
          value: "true"
        - name: TR_ENDPOINT
          value: "otel-collector.observability.svc.cluster.local:4318"
        - name: TR_HTTPS
          value: "false"
        - name: DB_TRACE
          value: "true"
        - name: DB_SSL
          value: "true"
        - name: DB_NAME
          value: "utr_staging"
        - name: DB_HOST
          value: "pg-staging-cluster.default.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: utr-staging-user.pg-staging-cluster.credentials.postgresql.acid.zalan.do
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: utr-staging-user.pg-staging-cluster.credentials.postgresql.acid.zalan.do
              key: password
        livenessProbe:
          httpGet:
            path: /live
            port: health
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 60
          periodSeconds: 5
