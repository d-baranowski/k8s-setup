apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: utr-staging-notification
  namespace: default
  labels:
    app: utr-staging-notification
spec:
  serviceName: utr-staging-notification
  replicas: 1
  selector:
    matchLabels:
      app: utr-staging-notification
  template:
    metadata:
      labels:
        app: utr-staging-notification
    spec:
      containers:
      - name: notification
        image: ghcr.io/inspiration-particle/utro-notification:0.1.129 # {"$imagepolicy": "flux-system:utr-staging-notification"}
        ports:
        - containerPort: 9002
          name: api
        - containerPort: 18007
          name: health
        env:
        - name: TIMEZONE
          value: "Europe/Warsaw"
        - name: HEALTH_PORT
          value: "18007"
        - name: API_PORT
          value: "9002"
        - name: LOG_LEVEL
          value: "debug"
        - name: SERVICE_VERSION
          value: "0.1.129" # {"$imagepolicy": "flux-system:utr-staging-notification:tag"}
        - name: SERVICE_NAME
          value: "rpg.notification"
        - name: SERVICE_ENV
          value: "staging"
        - name: ENABLE_DEV_API
          value: "true"
        - name: TR_ENABLED
          value: "true"
        - name: TR_ENDPOINT
          value: "otel-collector.observability.svc.cluster.local:4318"
        - name: TR_HTTPS
          value: "false"
        - name: DB_TRACE
          value: "true"
        - name: DB_SSL
          value: "true"
        - name: DB_NAME
          value: "utr_staging"
        - name: DB_HOST
          value: "pg-staging-cluster.default.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        # Every one of these has a dev default that resolves to nothing here.
        # CORE_SERVICE_URL defaults to "http://rpg.core" — the docker-compose
        # hostname — so without it the service cannot reach core at all: every
        # RPC fails with "lookup rpg.core ... no such host", which silently
        # broke all subscription-addressed notifications (the practice was
        # never told when somebody joined the waiting list). The app URLs
        # default to localhost and end up as dead links in sent mail.
        - name: CORE_SERVICE_URL
          value: "http://utr-staging-core.default.svc.cluster.local:9102"
        - name: ADMIN_APP_URL
          value: "https://utro-test.inspi.cloud"
        - name: CUSTOMER_APP_URL
          value: "https://customer.inspi.cloud"
        - name: EMAIL_FROM_ADDRESS
          value: "kontakt@inspiration-particle.com"
        - name: EMAIL_API_KEY
          valueFrom:
            secretKeyRef:
              name: resend-staging
              key: value
        - name: EMAIL_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: staging-webhook-secret-resend
              key: value
        - name: PUBLIC_WEBHOOK_URL
          value: "https://utro-test.inspi.cloud/webhook"
        - name: ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: twilio-staging-sid
              key: value
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: twilio-staging-token
              key: value
        - name: FROM_PHONE
          valueFrom:
            secretKeyRef:
              name: twilio-staging-phone
              key: value
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: utr-staging-user.pg-staging-cluster.credentials.postgresql.acid.zalan.do
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: utr-staging-user.pg-staging-cluster.credentials.postgresql.acid.zalan.do
              key: password
        livenessProbe:
          httpGet:
            path: /live
            port: health
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 60
          periodSeconds: 5
