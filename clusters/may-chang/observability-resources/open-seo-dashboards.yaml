# Dashboard for the OpenSEO deployment (clusters/may-chang/open-seo).
#
# Same shape as grafana-dashboards.yaml: owned by grafana-operator, JSON kept in
# a sibling file and referenced through a ConfigMap so it stays readable and
# diffable rather than being pasted into this manifest.
#
# Unlike the Utro dashboards, none of these panels come from the app. OpenSEO
# ships no OpenTelemetry instrumentation and exposes no /metrics endpoint, so
# there is nothing for otel-collector to receive. Everything here is
# kube-state-metrics, cAdvisor and Promtail — process health and the boot-time
# rebuild, not SEO work. App-level metrics would need upstream instrumentation.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: open-seo-folder
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  title: OpenSEO
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: open-seo-overview
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folderRef: open-seo-folder
  resyncPeriod: 5m
  configMapRef:
    name: open-seo-dashboard-overview
    key: open-seo.json
