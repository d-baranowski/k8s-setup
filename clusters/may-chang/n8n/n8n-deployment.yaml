---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-deployment
  namespace: default
  labels: &labels
    app: n8n
    component: deployment
spec:
  # Parked at 0 on 2026-09-16: nothing is using n8n. Scaled rather than deleted,
  # so bringing it back is this one line.
  #
  # Deleting it instead would mean removing the resources from
  # n8n/kustomization.yaml, and that Kustomization sets prune: true — Flux would
  # take the Service, the Ingress and the ConfigMap with it. Recoverable from
  # git, but a bigger hole than parking needs to dig.
  #
  # What survives: the workflows, which live in the `n8n` database on
  # pg-op-cluster, along with the n8n_user role and its pg_hba lines. None of
  # that is touched here, and none of it costs anything while the pod is down.
  #
  # What does NOT survive, and did not survive any of the 8 restarts this pod
  # has already had: this Deployment mounts no volume and sets no
  # N8N_ENCRYPTION_KEY, so anything n8n keeps in ~/.n8n is in the container's
  # ephemeral layer. Stored credentials may not decrypt when it comes back.
  # Re-entering them is the expected cost of restarting it.
  replicas: 0
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:1.98.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5678
        env:
        - name: N8N_HOST
          value: "n8n.local"
        - name: WEBHOOK_URL
          value: "https://n8n.local/"
        - name: N8N_PROTOCOL
          value: "https"
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-user.pg-op-cluster.credentials.postgresql.acid.zalan.do
              key: password
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-user.pg-op-cluster.credentials.postgresql.acid.zalan.do
              key: password
        envFrom:
        - configMapRef:
            name: n8n-configmap
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
        resources:
          limits:
            cpu: "1.0"
            memory: "1024Mi"
          requests:
            cpu: "0.5"
            memory: "512Mi"