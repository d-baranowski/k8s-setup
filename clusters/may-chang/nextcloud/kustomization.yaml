apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Flux Kustomization applying this directory
# (flux-system/nextcloud-kustomization.yaml) declares dependsOn for
# external-secrets-resources, pg-operator and tailscale-operator, so the
# ClusterSecretStore, the Postgres role and the tailscale IngressClass all exist
# before any of this is applied.
#
# Flux reconciles what this file LISTS. A manifest sitting in this directory
# without an entry here is inert, silently and forever.
resources:
  - namespace.yaml
  - admin-secret.yaml
  - redis-secret.yaml
  - restic-secret.yaml
  - smtp-secret.yaml
  - configmap.yaml
  - pvc.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - backup-cronjob.yaml
  - configure-job.yaml
  - alerts.yaml
