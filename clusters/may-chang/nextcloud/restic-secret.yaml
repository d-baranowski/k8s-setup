# Credentials for the backup repository: the restic password, and the AWS keys
# for kadis-ad77fef6-backups.
#
# The restic password is NOT recoverable and NOT derivable from anything else.
# restic encrypts client-side, so losing this entry means the snapshots are
# ciphertext forever — the backups are then indistinguishable from no backups.
# It lives in Secret Manager for that reason and nowhere else.
#
#   openssl rand -base64 48 | tr -d '\n' \
#     | gcloud secrets create nextcloud-restic-password --project=danb-ubuntu-k0s --data-file=-
#
# The two AWS entries already exist — they are created by the infra/kadis
# Terraform stack and are the same pair sqlserver/backup-aws-creds.yaml reads.
# External Secrets is namespaced, so this is a second copy of them rather than a
# second IAM user.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-restic
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: nextcloud-restic
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        RESTIC_PASSWORD: "{{ .password | trim }}"
        AWS_ACCESS_KEY_ID: "{{ .accessKeyId | trim }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secretAccessKey | trim }}"
  data:
    - secretKey: password
      remoteRef:
        key: nextcloud-restic-password
        version: latest
    - secretKey: accessKeyId
      remoteRef:
        key: kadis-ad77fef6-backups-aws-access-key-id
        version: latest
    - secretKey: secretAccessKey
      remoteRef:
        key: kadis-ad77fef6-backups-aws-secret-access-key
        version: latest
