# The initial administrator account.
#
# Nextcloud runs its installer on first boot and creates this account from
# NEXTCLOUD_ADMIN_USER/PASSWORD. After that the variables are ignored — changing
# the password here does NOT change it in the running instance, and the entry
# exists mainly so the first login is not a secret nobody wrote down.
#
# Create it once:
#   openssl rand -base64 30 | tr -d '\n' \
#     | gcloud secrets create nextcloud-admin-password --project=danb-ubuntu-k0s --data-file=-
#
# Read it back when you need to log in:
#   gcloud secrets versions access latest --secret=nextcloud-admin-password --project=danb-ubuntu-k0s
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: nextcloud-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .value | trim }}"
  data:
    - secretKey: value
      remoteRef:
        key: nextcloud-admin-password
        version: latest
