# Redis AUTH password.
#
# Redis is given a password even though it is only reachable inside the cluster,
# because "inside the cluster" is not a boundary here: this cluster runs no
# NetworkPolicies, so a ClusterIP Service is reachable from every pod in every
# namespace. Nextcloud's Redis holds session tokens and the transactional file
# locks, and an unauthenticated one would let any workload on may-chang read
# sessions or take locks that wedge everyone's uploads.
#
# Create it once:
#   openssl rand -hex 32 | tr -d '\n' \
#     | gcloud secrets create nextcloud-redis-password --project=danb-ubuntu-k0s --data-file=-
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-redis
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: nextcloud-redis
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .value | trim }}"
  data:
    - secretKey: value
      remoteRef:
        key: nextcloud-redis-password
        version: latest
