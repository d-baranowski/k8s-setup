# SMTP password for outbound mail — password resets, share notifications and
# the activity digest.
#
# Reuses the resend-production entry that utro and passbolt already send with,
# rather than minting a third API key for the same provider: one key to rotate,
# one place to revoke.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nextcloud-smtp
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: nextcloud-smtp
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .value | trim }}"
  data:
    - secretKey: value
      remoteRef:
        key: resend-production
        version: latest
