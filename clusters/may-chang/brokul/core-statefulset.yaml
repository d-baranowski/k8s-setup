# The domain service. Everything except sign-in verification happens here, and
# every table it owns is behind row-level security keyed on a GUC that
# pkg/repository sets per transaction.
#
# THE ROLE IT CONNECTS AS IS LOAD-BEARING. A superuser bypasses RLS entirely and
# a table owner bypasses it unless the table says FORCE — so the policies are
# only doing anything at all when the connection is a non-superuser role. That is
# the case here (`brokul.brokul_user`, no flags) and is NOT the case in the local
# compose stack, which connects as `postgres`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: brokul-core
  namespace: brokul
  labels:
    app: brokul-core
spec:
  serviceName: brokul-core
  replicas: 2
  selector:
    matchLabels:
      app: brokul-core
  template:
    metadata:
      labels:
        app: brokul-core
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
      - name: core
        # 0.1.6 makes core.user_permission_view security_invoker. Without it a
        # view applies the RLS of its OWNER whoever asks, so the permission
        # refresh disagreed with its own prune under an administrator and
        # emptied core.user_permission for every user on the cluster.
        #
        # 0.1.5 carries the same permission-check fix as gateway 0.1.1: the
        # check reads core.user_permission, not the owner-evaluated view.
        #
        # 0.1.4 lets provisioning FIND the account it created. The opening
        # lookup is `where external_id = $1`, RLS applies to it, and the session
        # has no identity yet — so it saw nothing, inserted again, and collided
        # with its own row on every request. It now asserts the Firebase uid the
        # gateway verified, and the policy admits exactly that row.
        #
        # 0.1.3 gave a self-provisioned account its permissions, and stops it
        # deleting everybody else's — the permission refresh is SECURITY INVOKER
        # over two FORCE-RLS tables, so it saw nothing and its unscoped prune
        # emptied core.user_permission for every user on the system.
        #
        # 0.1.2 dropped the RETURNING clause from the provisioning insert. Postgres
        # applies SELECT policies to a RETURNING projection, and a new customer
        # cannot read core.user — so the row was written and then refused on the
        # way back out, with the same error text a WITH CHECK violation gives.
        #
        # 0.1.1 carried the first-login bootstrap: a migration that seeds the
        # customer role on a database that has never had a user, and an insert
        # policy that lets an identity create its own core.user row. Before it,
        # the first sign-in on an empty database died on "new row violates
        # row-level security policy" — a hole that exists only where the app
        # connects as a role RLS applies to, which is nowhere in development,
        # where DB_USER defaults to the postgres superuser.
        image: ghcr.io/inspiration-particle/brokul-core:0.1.11
        ports:
        - containerPort: 9102
          name: api
        - containerPort: 8081
          name: health
        env:
        - name: SERVICE_NAME
          value: "brokul.core"
        - name: API_PORT
          value: "9102"
        - name: HEALTH_PORT
          value: "8081"
        - name: TIMEZONE
          value: "Europe/Warsaw"
        - name: SERVICE_ENV
          value: "prod"
        - name: SERVICE_VERSION
          value: "0.1.11"
        - name: LOG_LEVEL
          value: "info"
        - name: TR_ENABLED
          value: "true"
        - name: TR_ENDPOINT
          value: "otel-collector.observability.svc.cluster.local:4318"
        - name: TR_HTTPS
          value: "false"
        - name: DB_HOST
          value: "pg-op-cluster.default.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "brokul"
        - name: DB_SSL
          value: "true"
        # The operator generates this Secret. The `brokul.` prefix on the role
        # name is what puts it in THIS namespace rather than in `default` —
        # enable_cross_namespace_secret in the operator's helm values, the same
        # notation passbolt uses. The price is that the prefix is part of the
        # Postgres role name, so the role really is called "brokul.brokul_user".
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: brokul.brokul-user.pg-op-cluster.credentials.postgresql.acid.zalan.do
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: brokul.brokul-user.pg-op-cluster.credentials.postgresql.acid.zalan.do
              key: password
        livenessProbe:
          httpGet: { path: /live, port: health }
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /ready, port: health }
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests: { cpu: 100m, memory: 192Mi }
          limits:   { memory: 512Mi }
