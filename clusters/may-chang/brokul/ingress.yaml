# One host, one backend. Everything else the browser asks for — RPC, assets — is
# a path on this same origin that the Next server proxies onward inside the
# cluster.
#
# NO rewrite-target annotation. utro's ingress carries `rewrite-target: /`, which
# rewrites every path to the root; it works there because that ingress fronts a
# single-page app whose routing is client-side. Brokuł's server handles real
# paths, and a rewrite would send /food, /api/rpc and /api/assets all to /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: brokul
  namespace: brokul
  annotations:
    # Uploads are capped at 20MB by the assets service, and they travel through
    # here. nginx defaults to 1m and answers 413 — which surfaces in the app as
    # a photo that will not attach, with nothing in the service's logs because
    # the request never reached it.
    nginx.ingress.kubernetes.io/proxy-body-size: "24m"
    # Rendering a ladder from a large upload takes longer than the 60s default.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: brokul.inspiration-particle.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: brokul-web
                port:
                  number: 3000
