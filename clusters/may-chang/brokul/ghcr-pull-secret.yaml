# Authenticated pulls for ghcr.io/inspiration-particle/brokul-*.
#
# A per-namespace copy, and it has to be: a Secret cannot be referenced from
# another namespace, which is why the cluster already carries this same
# ExternalSecret four times over (flux-system, kadis, open-seo, and now here).
#
# Authenticating is not optional even for a public package. ghcr.io rate-limits
# ANONYMOUS pulls per source IP and answers `403 Forbidden` from /token once you
# are over the line, which surfaces as an ImagePullBackOff that reads like a
# permissions problem — the cluster hit exactly that on open-seo's first rollout.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: brokul
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # `trim` guards against a trailing newline in the stored token, which
        # would inject a raw newline into the JSON and make it unparseable.
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"edwardelriczeroclaw-spec","password":"{{ .token | trim }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-pull-token
        version: latest
