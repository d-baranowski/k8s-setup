apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kadis-aws-access-key
  namespace: kadis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: kadis-aws-access-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        value: "{{ .value | trim }}"
  data:
    - secretKey: value
      remoteRef:
        key: kadis-aws-access-key
        version: latest
---
