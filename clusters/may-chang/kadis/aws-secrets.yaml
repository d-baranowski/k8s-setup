  target:
    name: kadis-aws-secret-access-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        value: "{{ .value | trim }}"
  data:
    - secretKey: value
      remoteRef:
        key: kadis-aws-secret-access-key
        version: latest
