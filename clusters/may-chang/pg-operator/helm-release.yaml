apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pg-operator
  namespace: default
spec:
  # Override Release name to avoid the pattern Namespace-Release
  # Ref: https://fluxcd.io/flux/components/helm/api/v2/#helm.toolkit.fluxcd.io/v2.HelmRelease
  releaseName: pg-operator
  targetNamespace: default
  interval: 10m
  chart:
    spec:
      chart: postgres-operator
      version: 1.15.1
      sourceRef:
        kind: HelmRepository
        name: pg-operator
        namespace: flux-system
  values:
    installCRDs: true
    enableJsonLogging: true
    # MUST be nested under configKubernetes, not set at the top level.
    #
    # This chart defaults to configTarget: OperatorConfigurationCRD, and
    # templates/operatorconfiguration.yaml builds the CRD's `kubernetes:` block
    # from `.Values.configKubernetes` and nothing else. A top-level
    # `enable_cross_namespace_secret: true` maps to no chart key at all, and
    # Helm does not consider an unused value an error — so it was accepted,
    # rendered nothing, and the operator ran with the chart default of false.
    #
    # The failure is quiet and a long way from the cause. With the flag off, a
    # `namespace.user` entry in cluster.yaml still creates the role — the dot
    # just becomes part of the role name — but the credentials Secret is written
    # into the cluster's own namespace, `default`, rather than the app's. The
    # app then cannot start, with a CreateContainerConfigError naming a Secret
    # that does exist, in a namespace nobody looked in.
    #
    # That is what kept passbolt from ever starting, and nextcloud after it.
    # Check it in the rendered object, never in this file:
    #   kubectl -n default get operatorconfiguration pg-operator-postgres-operator \
    #     -o jsonpath='{.configuration.kubernetes.enable_cross_namespace_secret}'
    configKubernetes:
      enable_cross_namespace_secret: true
    configLogicalBackup:
      logical_backup_provider: s3
      logical_backup_s3_bucket: utro-a253e7cf-backups
      logical_backup_s3_bucket_prefix: spilo
      logical_backup_s3_region: eu-central-1
      logical_backup_s3_retention_time: 14 days
      logical_backup_schedule: '30 02 * * *'
      logical_backup_cronjob_environment_secret: postgres-backup-aws-creds

  # Ref: https://fluxcd.io/flux/components/helm/api/v2/#helm.toolkit.fluxcd.io/v2.Install
  install:
    createNamespace: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pg-operator-ui
  namespace: default
spec:
  # Override Release name to avoid the pattern Namespace-Release
  # Ref: https://fluxcd.io/flux/components/helm/api/v2/#helm.toolkit.fluxcd.io/v2.HelmRelease
  releaseName: pg-operator-ui
  targetNamespace: default
  interval: 10m
  chart:
    spec:
      chart: postgres-operator-ui
      version: 1.15.1
      sourceRef:
        kind: HelmRepository
        name: pg-operator-ui
        namespace: flux-system

  # Ref: https://fluxcd.io/flux/components/helm/api/v2/#helm.toolkit.fluxcd.io/v2.Install
  install:
    createNamespace: true