# Alerts for the shared Postgres.
#
# Prometheus discovers PrometheusRules in every namespace, so these live next to the cluster
# they describe — same reasoning as nextcloud/alerts.yaml and passbolt/alerts.yaml.
#
# THESE EXIST BECAUSE NOTHING SAID ANYTHING. The cluster was OOMKilled five times in three days
# on the operator's default 500Mi limit, and the way it surfaced was a person opening an app
# and being told the plan could not be loaded. Every pod was Running, the site answered 200,
# and the only trace was `cannot execute LISTEN during recovery` in a service log nobody reads
# and an eighteen-second page load nobody measured.
#
# One database serves six tenants here. A restart is never local to the workload that caused
# it, which is precisely why it needs to be announced rather than discovered.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pg-op-cluster-alerts
  namespace: default
  labels:
    app: pg-op-cluster
    component: alerts
spec:
  groups:
    - name: pg-op-cluster
      rules:
        # THE ONE THAT MATTERS. An OOMKill is not a restart that happened to be untidy: the
        # database comes back in recovery, every LISTEN in every tenant fails until it is out,
        # and any connection pool holding a socket gets an unexpected EOF rather than an error
        # it can explain.
        - alert: PostgresOOMKilled
          expr: >-
            kube_pod_container_status_last_terminated_reason{namespace="default", pod=~"pg-op-cluster-.*", reason="OOMKilled"} == 1
          for: 1m
          labels:
            severity: critical
            service: postgres
          annotations:
            summary: "The shared Postgres was OOMKilled"
            description: >-
              pg-op-cluster hit its memory limit and was killed. It serves utro, n8n,
              mattermost, passbolt, nextcloud and brokuł, so every one of them saw a database
              in recovery. Check the limit in clusters/may-chang/pg-operator/cluster.yaml
              against what the workloads now need —
              `kubectl -n default describe pod pg-op-cluster-0 | grep -A5 "Last State"` —
              rather than restarting it and waiting for the next one.

        - alert: PostgresRestartLoop
          expr: increase(kube_pod_container_status_restarts_total{namespace="default", pod=~"pg-op-cluster-.*", container="postgres"}[6h]) > 2
          for: 10m
          labels:
            severity: critical
            service: postgres
          annotations:
            summary: "The shared Postgres restarted {{ $value | humanize }} times in six hours"
            description: >-
              Repeated restarts of the one database every tenant depends on. Patroni comes back
              in recovery each time, which shows up in the apps as reads that fail for a minute
              and then start working — the kind of fault people report as "it was down earlier"
              and cannot reproduce.

        # Near the limit, before it is over it. The point of this one is to be boring: it
        # should fire days before the two above ever can.
        - alert: PostgresMemoryNearLimit
          expr: >-
            container_memory_working_set_bytes{namespace="default", pod=~"pg-op-cluster-.*", container="postgres"}
            / on(pod) kube_pod_container_resource_limits{namespace="default", pod=~"pg-op-cluster-.*", container="postgres", resource="memory"}
            > 0.85
          for: 30m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: "The shared Postgres is using {{ $value | humanizePercentage }} of its memory limit"
            description: >-
              Sustained above 85% of the limit. Raising it is a one-line change to the
              postgresql resource in clusters/may-chang/pg-operator/cluster.yaml, and applying
              it restarts the pod once for every tenant — cheaper done deliberately than as an
              OOMKill at an unchosen moment.

        # PG_CRON, WHICH FAILED 616,864 TIMES WITHOUT ANYONE FINDING OUT.
        #
        # core.clear_expired_user_locks() was scheduled on pg-staging-cluster on 2026-06-04
        # and never once succeeded. `cron.job` showed it active, `cron.job_run_details` grew
        # a fresh row every minute, and every row said status = failed. There was no metric
        # that could have fired, because nothing exports pg_cron's state — so the next three
        # alerts watch the pg-cron-healthcheck CronJob, which asks the question every fifteen
        # minutes and exits non-zero when the answer is wrong.
        - alert: PgCronJobFailing
          expr: kube_job_failed{namespace="default", job_name=~"pg-cron-healthcheck.*", condition="true"} > 0
          for: 5m
          labels:
            severity: critical
            service: postgres
          annotations:
            summary: "A pg_cron job is not running on one of the Postgres clusters"
            description: >-
              pg-cron-healthcheck found a scheduled pg_cron job that is failing, has never
              succeeded, has never launched, or has been switched off — on pg-op-cluster,
              pg-staging-cluster, or both. Which job and which cluster is in the pod log:
              `kubectl -n default logs -l app=pg-cron-healthcheck --tail=50`.
              A pg_cron job that cannot connect looks identical to one that is working
              unless you read job_run_details.status, so treat this as the only warning
              you will get.

        # The check not running is the same failure as the thing it checks, one level up.
        # `unless` keeps this quiet while PgCronJobFailing is already firing — this one is
        # specifically "the check stopped happening", not "the check found something".
        - alert: PgCronHealthcheckNotRunning
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{namespace="default", cronjob="pg-cron-healthcheck"} > 3600)
            unless on() (kube_job_failed{namespace="default", job_name=~"pg-cron-healthcheck.*", condition="true"} > 0)
          for: 15m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: "pg-cron-healthcheck has not completed for over an hour"
            description: >-
              The CronJob runs every 15 minutes and is neither succeeding nor failing, so it
              is not running at all — suspended, unschedulable, or unable to start its pod.
              While that is true, nothing is watching pg_cron on either cluster.

        - alert: PgCronHealthcheckMissing
          expr: absent(kube_cronjob_status_last_successful_time{namespace="default", cronjob="pg-cron-healthcheck"})
          for: 30m
          labels:
            severity: warning
            service: postgres
          annotations:
            summary: "pg-cron-healthcheck has disappeared"
            description: >-
              Prometheus can no longer see the CronJob at all — deleted, renamed, or removed
              from clusters/may-chang/pg-operator/kustomization.yaml. This alert exists
              because the original pg_cron failure was invisible for three and a half months,
              and a monitor that can be silently removed reproduces exactly that.
