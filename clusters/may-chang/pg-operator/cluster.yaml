apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: pg-op-cluster
  namespace: default
spec:
  teamId: "inspiration-particle"
  numberOfInstances: 1

  postgresql:
    version: "15"
    parameters:
      shared_preload_libraries: "pg_cron"
      cron.database_name: "utro"
      # pg_cron has to run its jobs in a background worker, because it cannot
      # authenticate as anything else.
      #
      # With this off (the default), pg_cron runs each job by opening a real
      # libpq connection to cron.host (localhost) as the job's role — and the
      # patroni.pg_hba block below replaced Spilo's defaults with md5 on every
      # host line. pg_cron has no password to offer, so every run is refused.
      # It does not warn, disable the job or back off; it retries every minute
      # forever. core.clear_expired_user_locks() failed 616,864 times on
      # pg-staging-cluster between 2026-06-04 and 2026-09-19 and succeeded
      # exactly never, which reads in cron.job_run_details as a job that is
      # scheduled and running.
      #
      # `on` drops the connection entirely: the job runs in a background worker
      # as its owning role, with no authentication in the path, so the pg_hba
      # block stops being able to silently disable cron. Postmaster-context
      # GUC, so it takes a Postgres restart to apply.
      cron.use_background_workers: "on"
      # Logical replication for the core-event CDC service (publication
      # core_event_pub, slot core_event_slot via pgoutput). Mirrors
      # pg-staging-cluster. Changing wal_level forces a Postgres restart on the
      # next operator reconcile (brief blip for all tenants on this shared
      # cluster: utro/mattermost/n8n) — apply in a maintenance window.
      wal_level: "logical"
      max_wal_senders: "10"
      max_replication_slots: "10"

  patroni:
    pg_hba:
      # local (unix socket)
      - "local   all             postgres                                md5"
      - "local   all             utro_user                               md5"
      - "local   all             n8n_user                                md5"
      - "local   all             mattermost_user                         md5"
      - "local   all             core_event                              md5"
      - "local   all             passbolt.passbolt_user                  md5"
      - "local   all             brokul.brokul_user                      md5"
      - "local   all             nextcloud.nextcloud_user                md5"

      # ANY host, no-SSL explicitly allowed (matches: no encryption)
      - "hostnossl all           postgres         0.0.0.0/0              md5"
      - "hostnossl all           utro_user        0.0.0.0/0              md5"
      - "hostnossl all           n8n_user         0.0.0.0/0              md5"
      - "hostnossl all           mattermost_user  0.0.0.0/0              md5"
      - "hostnossl all           core_event       0.0.0.0/0              md5"
      - "hostnossl all           passbolt.passbolt_user 0.0.0.0/0        md5"
      - "hostnossl all           brokul.brokul_user 0.0.0.0/0            md5"
      - "hostnossl all           nextcloud.nextcloud_user 0.0.0.0/0      md5"
      - "hostnossl all           postgres         ::/0                   md5"
      - "hostnossl all           utro_user        ::/0                   md5"
      - "hostnossl all           n8n_user         ::/0                   md5"
      - "hostnossl all           mattermost_user  ::/0                   md5"
      - "hostnossl all           core_event       ::/0                   md5"
      - "hostnossl all           passbolt.passbolt_user ::/0             md5"
      - "hostnossl all           brokul.brokul_user ::/0                 md5"
      - "hostnossl all           nextcloud.nextcloud_user ::/0           md5"

      # ANY host, SSL also allowed
      - "hostssl all            postgres         0.0.0.0/0              md5"
      - "hostssl all            utro_user        0.0.0.0/0              md5"
      - "hostssl all            n8n_user         0.0.0.0/0              md5"
      - "hostssl all            mattermost_user  0.0.0.0/0              md5"
      - "hostssl all            core_event       0.0.0.0/0              md5"
      - "hostssl all            passbolt.passbolt_user 0.0.0.0/0        md5"
      - "hostssl all            brokul.brokul_user 0.0.0.0/0            md5"
      - "hostssl all            nextcloud.nextcloud_user 0.0.0.0/0      md5"
      - "hostssl all            postgres         ::/0                   md5"
      - "hostssl all            utro_user        ::/0                   md5"
      - "hostssl all            n8n_user         ::/0                   md5"
      - "hostssl all            mattermost_user  ::/0                   md5"
      - "hostssl all            core_event       ::/0                   md5"
      - "hostssl all            passbolt.passbolt_user ::/0             md5"
      - "hostssl all            brokul.brokul_user ::/0                 md5"
      - "hostssl all            nextcloud.nextcloud_user ::/0           md5"

  env:
    - name: WAL_S3_BUCKET
      value: utro-a253e7cf-backups
    - name: AWS_REGION
      value: eu-central-1
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: postgres-backup-aws-creds
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: postgres-backup-aws-creds
          key: AWS_SECRET_ACCESS_KEY

  # WHAT THE DATABASE IS ALLOWED TO USE, stated here rather than inherited.
  #
  # Without this block the operator's defaults apply, which are 100Mi requested and 500Mi
  # limit — for one Postgres serving six tenants (utro, n8n, mattermost, passbolt, nextcloud,
  # brokul). It was OOMKilled five times in three days, and the symptom is not a database that
  # is down: it is Patroni coming back up in recovery, `cannot execute LISTEN during recovery`
  # in every service that subscribes to a channel, requests that take eighteen seconds, and an
  # app reporting "could not load" while its own pods are perfectly healthy.
  #
  # What pushed it over was brokuł's product library: twenty-two thousand rows carrying a GIN
  # trigram index and a GIN tsvector, plus searches that scan them. That is a small table by
  # any normal measure — which is the point. 500Mi was never a limit anybody chose, and the
  # first workload to ask anything of the database found it.
  #
  # 2Gi limit, 768Mi requested. The node has 16Gi allocatable and 74% requested before this,
  # so the request fits comfortably; the limit is headroom for an index build rather than a
  # target. Applying it restarts the pod once, briefly, for every tenant — which is what has
  # already been happening five times unannounced.
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi

  volume:
    size: 40Gi

  enableLogicalBackup: true

  users:
    n8n_user: [CREATEROLE]
    utro_user: [CREATEROLE]
    mattermost_user: [CREATEROLE]
    # Dedicated CDC role for core-event: REPLICATION to own the logical slot,
    # BYPASSRLS to read the FORCE-RLS core tables its transformers enrich from.
    # Table/pgmq grants are applied by the core migrate job (core_event_grants
    # migration), so no bootstrap service is needed in prod. → creates secret
    # core-event.pg-op-cluster.credentials.postgresql.acid.zalan.do
    core_event: [LOGIN, REPLICATION, BYPASSRLS]
    # Passbolt, which runs in its own namespace rather than in `default` like
    # the other tenants here. The `passbolt.` prefix is the operator's
    # cross-namespace notation (enable_cross_namespace_secret, already on in
    # helm-release.yaml): it puts the generated credentials secret in the
    # `passbolt` namespace, at the price of the prefix becoming part of the
    # Postgres role name. No flags — passbolt owns its database and creates
    # nothing outside it.
    passbolt.passbolt_user: []
    # Brokuł, also in its own namespace — same cross-namespace notation, same
    # price paid on the role name.
    #
    # NO FLAGS, AND THAT IS THE WHOLE POINT. Brokuł's authorisation model is
    # row-level security and nothing else: a role with SUPERUSER or BYPASSRLS has
    # no policies applied to it at all, so every policy in that schema would
    # quietly stop meaning anything while the app carried on working perfectly.
    # It owns its own database so it can migrate it, and its tables carry FORCE
    # ROW LEVEL SECURITY so that ownership is not a second way round.
    brokul.brokul_user: []
    # Nextcloud, also in its own namespace — same cross-namespace notation, same
    # price paid on the role name. No flags: it owns its database, runs its own
    # schema migration inside it on every version upgrade, and needs nothing
    # outside it.
    #
    # Nextcloud runs on kadis while this cluster is on may-chang, so its queries
    # cross a node boundary. That is the deliberate trade: putting a Postgres
    # next to the files on kadis would have meant a database with no backup
    # story, where this one inherits the WAL-to-S3 archiving and the 02:30
    # logical dump that already run here, with no per-database configuration.
    nextcloud.nextcloud_user: []

  databases:
    n8n: n8n_user
    utro: utro_user
    mattermost: mattermost_user
    # Owned by the role above, so passbolt can run its own migrations. The
    # namespace prefix is part of the role name here too.
    passbolt: passbolt.passbolt_user
    brokul: brokul.brokul_user
    nextcloud: nextcloud.nextcloud_user
