apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: utro-ui
  namespace: default
  labels:
    app: utro-ui
spec:
  serviceName: utro-ui
  replicas: 2
  selector:
    matchLabels:
      app: utro-ui
  template:
    metadata:
      labels:
        app: utro-ui
    spec:
      containers:
      - name: ui
        image: ghcr.io/inspiration-particle/utro-ui:0.1.137
        ports:
        - containerPort: 3000
          name: http
        env:
        # Full URL: the Next BFF at /api/assets proxies multipart uploads here,
        # which keeps the gateway out of the byte path while preserving auth.
        - name: ASSETS_API_URL
          value: "http://utro-assets.default.svc.cluster.local:9003"
        - name: TIMEZONE
          value: "Europe/Warsaw"
        - name: NODE_ENV
          value: "production"
        - name: BFF_URL
          value: "http://utro-gateway.default.svc.cluster.local:9999"
        - name: SERVICE_ENV
          value: "prod"
        # Proves to the gateway that a request comes from the admin UI's server
        # (UTR-000892). Both ends must hold the same value.
        - name: GATEWAY_BFF_SECRET
          valueFrom:
            secretKeyRef:
              name: utro-gateway-bff
              key: GATEWAY_BFF_SECRET
        - name: SERVICE_VERSION
          value: "0.1.137"
        - name: VERSION_CHECK_URLS
          value: "core=utro-core:18007,gateway=utro-gateway:18007,payment=utro-payment:18007,notification=utro-notification:18007,assets=utro-assets:18007"
        - name: PORT
          value: "3000"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        - name: NEXT_PUBLIC_OTEL_ENABLED
          value: "true"
        - name: NEXT_PUBLIC_OTEL_ENDPOINT
          value: "/otel/v1/traces"
        - name: NEXT_PUBLIC_SERVICE_ENV
          value: "prod"
        - name: OTEL_COLLECTOR_URL
          value: "http://otel-collector.observability.svc.cluster.local:4318"
        - name: CF_TEAM_DOMAIN
          value: inspiration-particle.cloudflareaccess.com
        - name: CF_JWT_ISSUER
          value: https://inspiration-particle.cloudflareaccess.com
        - name: CF_JWT_AUDIENCE
          value: afe0fdc2ff299a8bdc7c1e5fd42cc98ecb9c965f447abce6c559b5d6d3613865
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: utro-ui-session
              key: JWT_SECRET
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
