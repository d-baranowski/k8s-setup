# The pepper core keys the HMACs of customer sign-in codes, links and addresses
# with (UTR-000320). It never enters the database, so a dump reveals no code.
#
# Create it once, per environment, before switching SIGN_IN_ENABLED on:
#   openssl rand -base64 48 | tr -d '\n' | gcloud secrets create utro-core-sign-in-pepper --data-file=-
# A copy of another environment's pepper would let its codes verify here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: utro-core-sign-in
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: utro-core-sign-in
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SIGN_IN_PEPPER
      remoteRef:
        key: utro-core-sign-in-pepper
        version: latest
