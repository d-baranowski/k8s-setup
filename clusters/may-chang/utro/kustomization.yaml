apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# customer-gateway-* and customer-ui-* are deliberately left out until the
# customer app launches on its own domain: their 0.0.1 images were never
# published, so the pods sat in ImagePullBackOff and, with wait: true, kept
# this Kustomization from ever going Ready. The files stay here for launch.
resources:
  - gateway-statefulset.yaml
  - gateway-service.yaml
  - core-statefulset.yaml
  - core-service.yaml
  - core-migrate-job.yaml
  - core-event-statefulset.yaml
  - core-event-migrate-job.yaml
  - ui-statefulset.yaml
  - ui-service.yaml
  - utro-gateway-bff-secret.yaml
  - utro-cloudflare-tunnel-secret.yaml
  - utro-assets-s3-credentials.yaml
  - utro-ingress.yaml
  - utro-cloudflare-statefulset.yaml
  - payment-statefulset.yaml
  - payment-service.yaml
  - payment-migrate-job.yaml
  - notification-statefulset.yaml
  - notification-service.yaml
  - notification-migrate-job.yaml
  - assets-statefulset.yaml
  - assets-service.yaml
  - assets-migrate-job.yaml
  # assets-backfill-job.yaml is deliberately not listed; see its header.
