apiVersion: batch/v1
kind: Job
metadata:
  name: utro-assets-migrate
  namespace: default
  labels:
    app: utro-assets-migrate
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: utro-assets-migrate
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: ghcr.io/inspiration-particle/utro-assets:0.1.137
        # The shared docker/Dockerfile entrypoint is `sh -c "/app/$APP_NAME"`,
        # so args alone become $0 for that shell and never reach the binary —
        # the container would start the API server instead of migrating.
        command: ["/app/assets"]
        args: ["-migrate=true"]
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: DB_SSL
          value: "true"
        - name: DB_NAME
          value: "utro"
        - name: DB_HOST
          value: "pg-op-cluster.default.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        # Prod has no separate migrator role: utro_user owns the database and
        # runs every service's migrations, as the other migrate jobs here do.
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: utro-user.pg-op-cluster.credentials.postgresql.acid.zalan.do
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: utro-user.pg-op-cluster.credentials.postgresql.acid.zalan.do
              key: password
