apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: utro-assets
  namespace: default
  labels:
    app: utro-assets
spec:
  serviceName: utro-assets
  replicas: 1
  selector:
    matchLabels:
      app: utro-assets
  template:
    metadata:
      labels:
        app: utro-assets
    spec:
      containers:
      - name: assets
        image: ghcr.io/inspiration-particle/utro-assets:0.1.137
        ports:
        - containerPort: 9003
          name: api
        - containerPort: 18007
          name: health
        env:
        - name: TIMEZONE
          value: "Europe/Warsaw"
        - name: HEALTH_PORT
          value: "18007"
        - name: API_PORT
          value: "9003"
        - name: LOG_LEVEL
          value: "info"
        - name: SERVICE_VERSION
          value: "0.1.137"
        - name: SERVICE_NAME
          value: "rpg.assets"
        # Must not be "dev": on dev the service creates the bucket itself, and
        # production buckets are provisioned by Terraform with lifecycle rules
        # and access policies this service has no business deciding.
        - name: SERVICE_ENV
          value: "prod"
        - name: TR_ENABLED
          value: "true"
        - name: TR_ENDPOINT
          value: "otel-collector.observability.svc.cluster.local:4318"
        - name: TR_HTTPS
          value: "false"
        - name: DB_TRACE
          value: "true"
        - name: DB_SSL
          value: "true"
        - name: DB_NAME
          value: "utro"
        - name: DB_HOST
          value: "pg-op-cluster.default.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: utro-user.pg-op-cluster.credentials.postgresql.acid.zalan.do
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: utro-user.pg-op-cluster.credentials.postgresql.acid.zalan.do
              key: password
        # S3, from infra/utro (terraform output assets_service_env).
        - name: STORAGE_ENDPOINT
          value: "s3.eu-central-1.amazonaws.com"
        - name: STORAGE_BUCKET
          value: "utro-assets"
        - name: STORAGE_DOCUMENTS_BUCKET
          value: "utro-documents-prod"
        - name: STORAGE_REGION
          value: "eu-central-1"
        - name: STORAGE_USE_SSL
          value: "true"
        # Written by the assets ExternalSecret; the keys are the service's own
        # envconfig names, so they map straight across.
        - name: STORAGE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: utro-assets-s3-credentials
              key: STORAGE_ACCESS_KEY
        - name: STORAGE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: utro-assets-s3-credentials
              key: STORAGE_SECRET_KEY
        # What browsers fetch bytes from. Only storage keys are persisted, so
        # changing CDN is a config change rather than a data migration.
        - name: ASSETS_PUBLIC_BASE_URL
          value: "https://assets.inspiration-particle.com"
        livenessProbe:
          httpGet:
            path: /live
            port: health
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: health
          initialDelaySeconds: 60
          periodSeconds: 5
