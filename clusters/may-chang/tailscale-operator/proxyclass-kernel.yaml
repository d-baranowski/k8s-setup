# Tunnel MTU for the operator's proxies.
#
# THE ONE LINE THAT MATTERS is TS_DEBUG_MTU below. Without it every proxy in
# this cluster moves data at dial-up speeds, and it is close to invisible: small
# responses are fine, so health checks pass, dashboards look green, and only
# something large ever reveals it.
#
# The cause is an MTU inversion inside the proxy pod:
#
#   pod eth0     1230   (this cluster's CNI)
#   tailscale0   1280   (tailscaled's default)
#
# The tunnel interface is LARGER than the interface its packets must leave
# through, so every full-size packet needs fragmenting. On a node this never
# happens — host eth0 is 1500, comfortably above 1280 — which is why the same
# tailnet is fast between hosts and crawls through a proxy. 1150 leaves room for
# WireGuard's ~60-80 bytes of overhead inside 1230.
#
# Measured 2026-09-16 with the same 5.6MB Nextcloud bundle, before and after:
#
#   Ingress proxy        19KB/s  ->  47MB/s    (~2500x)
#   LoadBalancer proxy  300KB/s  ->  51MB/s     (~170x)
#   host tailscaled, for reference, 3.6MB/s
#
# Nextcloud was only the symptom: its dashboard is ~50 requests including
# multi-megabyte bundles, and it took 59 SECONDS with most assets never
# arriving. passbolt, open-seo, mattermost, grafana and the sqlserver
# LoadBalancer were all equally affected and nobody had noticed, because none of
# them routinely moves anything big.
#
# NOT NET_ADMIN. The first version of this file granted that capability, on the
# theory that the proxies needed kernel networking. That was wrong twice over:
# the operator hard-codes TS_USERSPACE=true for Ingress proxies so the
# capability changes nothing there, and it already grants NET_ADMIN itself for
# LoadBalancer proxies, so it was redundant there too. The measurements settle
# it — an Ingress proxy still running userspace netstack does 47MB/s once the
# MTU is right. Removed rather than left as a privilege nothing uses.
#
# If the CNI MTU ever changes, this has to change with it:
#   kubectl -n tailscale exec <proxy-pod> -- cat /sys/class/net/eth0/mtu
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: kernel-networking
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        env:
          - name: TS_DEBUG_MTU
            value: "1150"
