apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helm-repo.yaml
  - oauth-secret.yaml
  # Before the HelmRelease: proxyConfig.defaultProxyClass names this ProxyClass,
  # and the operator logs a warning and falls back to userspace networking if it
  # reconciles a proxy before the object exists.
  - proxyclass-kernel.yaml
  - helm-release.yaml
