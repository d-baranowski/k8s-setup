# Authenticated pulls for ghcr.io/every-app/open-seo.
#
# The image is public, so this looks unnecessary — but ghcr.io rate-limits
# ANONYMOUS pulls per source IP and answers with `403 Forbidden` from
# /token once you are over the line, which surfaces as an ImagePullBackOff that
# reads like a permissions problem. The cluster hit exactly that on the first
# rollout while the same anonymous request succeeded from a laptop on a
# different IP.
#
# Authenticating sidesteps the anonymous bucket entirely. Same pattern and same
# GCP-backed token as kadis/ghcr-pull-secret.yaml; the PAT needs no special
# grant for a public package.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: open-seo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        # `trim` guards against a trailing newline in the stored token, which
        # would inject a raw newline into the JSON and make it unparseable.
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"edwardelriczeroclaw-spec","password":"{{ .token | trim }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: ghcr-pull-token
        version: latest
