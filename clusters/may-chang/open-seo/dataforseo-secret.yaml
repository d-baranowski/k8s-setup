# DataForSEO credentials for OpenSEO. Without this the app boots but every SEO
# data feature is dark, so the Deployment mounts it as a required secretKeyRef
# and will not start until External Secrets has synced it.
#
# DataForSEO is a third-party pay-as-you-go service; OpenSEO is a UI over their
# API and has no data of its own. Get credentials at
# https://app.dataforseo.com/api-access -> "Send by email", then copy the value
# labelled "Base64" — it is ALREADY base64 of `email:api-password`, so store it
# verbatim rather than encoding it again:
#   printf '%s' 'PASTE_THE_BASE64_VALUE' \
#     | gcloud secrets create openseo-dataforseo-api-key \
#         --project=danb-ubuntu-k0s --data-file=-
#
# Working from the raw pair instead (the API password DataForSEO issues, not the
# account login password): printf '%s' 'you@example.com:api-password' | base64
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openseo-dataforseo-api-key
  namespace: open-seo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: openseo-dataforseo-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        # `trim` guards against a trailing newline in the stored value (easy to
        # add with `echo`), which would otherwise ride along into the
        # Authorization header and make every DataForSEO call fail to auth.
        value: "{{ .value | trim }}"
  data:
    - secretKey: value
      remoteRef:
        key: openseo-dataforseo-api-key
        version: latest
