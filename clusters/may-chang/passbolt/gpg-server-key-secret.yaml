# The passbolt server's OpenPGP keypair — the identity every client pins.
#
# This key does NOT decrypt anything in the vault: each secret is encrypted to
# the OpenPGP key of every user it is shared with, and the server never holds
# those private keys. What this one does is sign and decrypt the GPGAuth login
# challenge. Replace it and every browser extension that has already talked to
# this server refuses to log in until its user re-verifies the new fingerprint
# by hand. So: not a decryption key to guard, an identity to keep stable.
#
# Left alone, the image generates a keypair on first boot (gpg_gen_key in
# passbolt_docker's entrypoint) and writes it to whatever is mounted at
# /etc/passbolt/gpg — which on this cluster would be one local-path PVC, one
# copy, on one node. Generating it up front and keeping it here means the key
# outlives the volume, the node and the cluster.
#
# Generate it ONCE, before the first reconcile. The UID email must match
# PASSBOLT_KEY_EMAIL in configmap.yaml: with no passbolt.php in the image and no
# explicit PASSBOLT_GPG_SERVER_KEY_FINGERPRINT, the entrypoint finds the
# fingerprint by looking that address up in the keyring.
#
#   export GNUPGHOME=$(mktemp -d)
#   gpg --batch --gen-key <<'KEY'
#   Key-Type: RSA
#   Key-Length: 3072
#   Key-Usage: sign,cert
#   Subkey-Type: RSA
#   Subkey-Length: 3072
#   Subkey-Usage: encrypt
#   Name-Real: Passbolt server
#   Name-Email: passbolt@inspiration-particle.com
#   Expire-Date: 0
#   %no-protection
#   %commit
#   KEY
#   gpg --armor --export passbolt@inspiration-particle.com \
#     | gcloud secrets create passbolt-gpg-public  --project=danb-ubuntu-k0s --data-file=-
#   gpg --armor --export-secret-keys passbolt@inspiration-particle.com \
#     | gcloud secrets create passbolt-gpg-private --project=danb-ubuntu-k0s --data-file=-
#   rm -rf "$GNUPGHOME"
#
# Both deliberate, and both matching what the image would have generated itself:
# %no-protection, because passbolt uses the key unattended and a passphrase
# would only move the secret one file to the left; Expire-Date: 0, because an
# expired server key locks every client out at once.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: passbolt-gpg-server-key
  namespace: passbolt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: passbolt-gpg-server-key
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        # The key names are the filenames the entrypoint looks for under
        # /etc/passbolt/gpg, so this secret can be mounted as that directory.
        #
        # No `trim` here, unlike every other ExternalSecret in this repo: an
        # armored key is a block format that ends in a newline, and trimming it
        # off risks `gpg --import` rejecting the file outright. A stray trailing
        # newline is harmless in armor; a missing one is not.
        serverkey.asc: "{{ .public }}"
        serverkey_private.asc: "{{ .private }}"
  data:
    - secretKey: public
      remoteRef:
        key: passbolt-gpg-public
        version: latest
    - secretKey: private
      remoteRef:
        key: passbolt-gpg-private
        version: latest
