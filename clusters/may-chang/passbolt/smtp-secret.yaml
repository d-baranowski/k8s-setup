# Resend API key, used here as an SMTP password.
#
# Same key the utro notification service already sends with
# (utro/notification-statefulset.yaml, secret `resend-production` in `default`)
# — External Secrets is namespaced, so this is a second copy of that same Secret
# Manager entry rather than a second credential. Resend's SMTP gateway takes the
# literal username `resend` and the API key as the password; the username is not
# a secret and lives in configmap.yaml.
#
# Email is not needed to bootstrap the first admin — register-admin-job.yaml
# prints the setup URL into its own logs. It is needed for everything after:
# inviting anyone else, and account recovery when a passphrase is lost.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: passbolt-smtp
  namespace: passbolt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: passbolt-smtp
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .value | trim }}"
  data:
    - secretKey: value
      remoteRef:
        key: resend-production
        version: latest
