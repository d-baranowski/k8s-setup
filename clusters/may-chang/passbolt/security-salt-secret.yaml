# CakePHP's Security.salt for this instance.
#
# Passbolt ships the literal string `__SALT__` as the default (see
# config/app.default.php), and the docker image never replaces it — nothing
# fails loudly if you leave it, which is exactly why it is worth setting. It
# keys CakePHP's own hashing and encryption: CSRF tokens, cookie integrity, and
# anything passed through Security::encrypt.
#
# It is not vault material. Rotating it invalidates live sessions and any
# outstanding token, and nothing else — the passwords themselves are OpenPGP
# blobs encrypted to each user's key and never touch this value.
#
# Create it once:
#   openssl rand -hex 32 | tr -d '\n' \
#     | gcloud secrets create passbolt-security-salt --project=danb-ubuntu-k0s --data-file=-
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: passbolt-security-salt
  namespace: passbolt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: passbolt-security-salt
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        # `trim` guards against the trailing newline `echo` would add, which
        # would otherwise become part of the salt and change on any re-entry.
        salt: "{{ .salt | trim }}"
  data:
    - secretKey: salt
      remoteRef:
        key: passbolt-security-salt
        version: latest
