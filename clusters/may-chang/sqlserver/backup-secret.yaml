# Password for the `sqlserver_backup` login, which the backup CronJob uses.
# Held in db_backupoperator only — BACKUP DATABASE needs that and nothing more,
# so this login cannot read or change application data.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sqlserver-backup-password
  namespace: sqlserver
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: sqlserver-backup-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .password | trim }}"
  data:
    - secretKey: password
      remoteRef:
        key: sqlserver-backup-password
        version: latest
