# Passphrase for the client-side encryption of the Płatnik backups.
#
# This passphrase is NOT recoverable and NOT derivable from anything else. The
# backup CronJob encrypts client-side, so losing this entry means every object
# under sqlserver/ is ciphertext forever — the backups are then indistinguishable
# from no backups. It lives in Secret Manager for that reason and nowhere else.
#
#   openssl rand -base64 48 | tr -d '\n' \
#     | gcloud secrets create sqlserver-backup-passphrase --project=danb-ubuntu-k0s --data-file=-
#
# Rotating it does NOT re-encrypt anything already in the bucket. Objects stay
# readable only with the passphrase they were written under, so a rotation means
# re-encrypting everything still inside the retention window, or accepting that
# older backups need the old value. Keep the previous value until its last
# object has expired.
#
# The `| trim` below is load-bearing. `gcloud secrets versions add` from a file,
# or a careless echo, leaves a trailing newline; that newline would become part
# of the key, and the mismatch would only surface at restore time.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sqlserver-backup-passphrase
  namespace: sqlserver
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: sqlserver-backup-passphrase
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        passphrase: "{{ .passphrase | trim }}"
  data:
    - secretKey: passphrase
      remoteRef:
        key: sqlserver-backup-passphrase
        version: latest
