# Płatnik SQL logins, one "login = password" per line. These identify
# connections; the people themselves are Płatnik program users managed inside
# the program (Widok -> Administracja -> Użytkownicy).
#
# Adding someone: append a line to the Google Secret Manager secret
# (sqlserver-platnik-users, project danb-ubuntu-k0s) and re-run the
# platnik-bootstrap Job. The Job never drops logins — removing someone is a
# deliberate manual DROP USER + DROP LOGIN.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sqlserver-platnik-users
  namespace: sqlserver
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: sqlserver-platnik-users
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        users: "{{ .users }}"
  data:
    - secretKey: users
      remoteRef:
        key: sqlserver-platnik-users
        version: latest
