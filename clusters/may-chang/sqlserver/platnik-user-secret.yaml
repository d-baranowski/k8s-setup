# Password for the `platnik` SQL Server login used by the Płatnik program for
# day-to-day work. The value lives in Google Secret Manager (secret id:
# sqlserver-platnik-password) and never in this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sqlserver-platnik-password
  namespace: sqlserver
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: sqlserver-platnik-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .password | trim }}"
  data:
    - secretKey: password
      remoteRef:
        key: sqlserver-platnik-password
        version: latest
