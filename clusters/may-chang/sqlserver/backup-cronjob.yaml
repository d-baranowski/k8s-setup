# Hourly full backup of the Płatnik database — `platnik_migracja` — to S3.
#
# The name is a leftover: it was the transitional database the 2026 migration
# restored into, and on 2026-09-16 it became the only one. The scratch `platnik`
# database it ran alongside (2 payer stubs, no documents) was dropped, and its
# backups under sqlserver/platnik/ deleted with it.
#
# Three steps, because no one image can do it: Express edition does not support
# BACKUP TO URL for S3-compatible storage (Microsoft excludes Express and
# Express with Advanced Services explicitly), so the backup goes to the database
# volume first and a later container ships it to the bucket. Backup COMPRESSION
# is likewise Standard+, so the dump step gzips instead — it has to happen there
# because the aws-cli image ships no gzip. And encryption needs a third image
# again: mssql-tools has OpenSSL 1.0.2g, too old for -pbkdf2, while aws-cli has
# no openssl at all.
#
#   BACKUP DATABASE -> /var/opt/mssql/backup/*.bak -> gzip -> openssl enc -> s3://
#
# The objects are encrypted client-side before they leave the cluster. The
# bucket has SSE-S3 on top of that, but SSE-S3 is decrypted transparently for
# anyone holding the bucket credentials — which is the threat this guards
# against, along with AWS itself. The passphrase is in Secret Manager and
# nowhere else; see backup-passphrase-secret.yaml for what losing it means.
#
# Retention lives in S3, not here: the bucket's lifecycle rule (infra/kadis,
# module s3-backup) expires objects after 14 days and their noncurrent versions
# after 7. A job that prunes its own history is one bug away from deleting the
# wrong thing, and S3 expires objects whether or not the cluster is healthy.
#
# Local cleanup is unconditional and belt-and-braces — a `trap` on exit plus a
# sweep at the start of the next run. The backup directory is on the *database*
# volume, so an orphaned .bak is not untidiness, it's a countdown to a full
# disk taking SQL Server down with it.
#
# TO RESTORE: ../../../restore_kadis_db.sh (repo root). Its header carries the
# manual kubectl/sqlcmd fallback if the script itself is broken.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platnik-backup
  namespace: sqlserver
  labels:
    app: sqlserver
    component: backup
spec:
  schedule: "0 * * * *"
  timeZone: "Europe/Warsaw"
  # Never let a slow backup overlap the next hour's.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: sqlserver
            component: backup
        spec:
          restartPolicy: Never
          # mssql-data-sqlserver-0 is a local-path RWO volume whose PV is pinned
          # to kadis. Two pods may mount an RWO volume at once *on the same
          # node*; scheduling this anywhere else fails with a multi-attach error.
          # Must match the StatefulSet's nodeSelector.
          nodeSelector:
            kubernetes.io/hostname: kadis
          # Runs as root, deliberately. The msodbcsql 13 driver in the
          # mssql-tools image resolves the running UID against /etc/passwd and
          # dies with "Driver's SQLAllocHandle on SQL_HANDLE_HENV failed" if it
          # isn't there — and 10001 (the mssql user on the server image) does
          # not exist in the tools image. fsGroup keeps anything these
          # containers create group-owned by mssql, so the server process is
          # never locked out of its own volume.
          securityContext:
            fsGroup: 10001
          volumes:
            - name: mssql-data
              persistentVolumeClaim:
                claimName: mssql-data-sqlserver-0
            # Carries the generated .bak.gz path from the dump step to the
            # upload, which derives the S3 object key from it.
            - name: handoff
              emptyDir: {}
          initContainers:
            - name: dump
              # mssql-tools publishes no versioned tag, so the digest is the
              # only real pin. Resolved 2026-08-25 with
              #   docker buildx imagetools inspect mcr.microsoft.com/mssql-tools:latest
              image: mcr.microsoft.com/mssql-tools@sha256:62556500522072535cb3df2bb5965333dded9be47000473e9e0f84118e248642
              env:
                - name: SQL_HOST
                  value: "sqlserver"
                - name: PLATNIK_DB
                  value: "platnik_migracja"
                - name: BACKUP_DIR
                  value: "/var/opt/mssql/backup"
                - name: BACKUP_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sqlserver-backup-password
                      key: password
              volumeMounts:
                - name: mssql-data
                  mountPath: /var/opt/mssql
                - name: handoff
                  mountPath: /run/backup
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  SQLCMD=/opt/mssql-tools/bin/sqlcmd

                  # BACKUP DATABASE is executed by the *server* process (uid
                  # 10001), not by this container, so the directory has to be
                  # group-writable. This container is root and mkdir honours
                  # its umask, which would leave 0755 root:mssql and fail the
                  # backup with "Operating system error 5(Access is denied.)".
                  # chmod is applied unconditionally, so a directory created
                  # wrong by some earlier pod is repaired rather than inherited.
                  # 2775: setgid, so files land in the mssql group regardless of
                  # which of these jobs created the parent.
                  mkdir -p "$BACKUP_DIR"
                  chmod 2775 "$BACKUP_DIR"

                  # Anything still here is debris from a run that was killed
                  # before its trap could fire. Nothing else would ever remove
                  # it, and this volume is the database's.
                  shopt -s nullglob
                  for stale in "$BACKUP_DIR"/*.bak "$BACKUP_DIR"/*.bak.gz "$BACKUP_DIR"/*.bak.gz.enc; do
                    echo "sweeping stale file: $stale ($(stat -c %s "$stale") bytes)"
                    rm -f "$stale"
                  done
                  shopt -u nullglob

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  BAK="$BACKUP_DIR/${PLATNIK_DB}_$TS.bak"

                  echo "== backing up $PLATNIK_DB to $BAK =="
                  "$SQLCMD" -S "$SQL_HOST" -U sqlserver_backup -P "$BACKUP_PASSWORD" -b -x -i /dev/stdin <<SQL
                  BACKUP DATABASE [$PLATNIK_DB] TO DISK = N'$BAK'
                  WITH FORMAT, INIT, CHECKSUM, STATS = 10;
                  SQL

                  # No RESTORE VERIFYONLY here, on purpose. SQL Server counts
                  # it as a restore, so it demands CREATE DATABASE — which
                  # db_backupoperator does not grant, and handing a backup
                  # account the right to create databases costs more than the
                  # check is worth. What we rely on instead:
                  #   - BACKUP ... WITH CHECKSUM above, which validates every
                  #     page checksum as it reads and fails on a corrupt page
                  #   - gzip -t below on the compressed stream, and then the
                  #     encrypt step's decrypt|gzip -t on the exact bytes that
                  #     actually get uploaded
                  #   - the periodic restore rehearsal (restore_kadis_db.sh),
                  #     which is the only check that proves recoverability
                  # If you ever want VERIFYONLY back, the narrow way is
                  # `GRANT CREATE DATABASE TO [sqlserver_backup]` in master.

                  # Compress here rather than in the uploader: the aws-cli
                  # image ships no gzip (nor `which`), and Express has no
                  # native BACKUP ... WITH COMPRESSION.
                  echo "== compressing =="
                  gzip -f "$BAK"

                  echo "== checking the compressed stream =="
                  gzip -t "$BAK.gz"

                  echo "$BAK.gz" > /run/backup/path
                  ls -la "$BAK.gz"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "1"
                  memory: "512Mi"
            # Encryption gets its own step because neither of the other two
            # images can do it properly. The mssql-tools image ships OpenSSL
            # 1.0.2g (2016), which predates -pbkdf2 and would leave us deriving
            # the key with one pass of EVP_BytesToKey; the aws-cli image has no
            # openssl binary at all. The SQL Server image has OpenSSL 3.0.2, is
            # already digest-pinned in statefulset.yaml, and is already on this
            # node because the StatefulSet runs it — so this costs no extra pull.
            - name: encrypt
              image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
              env:
                - name: BACKUP_PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: sqlserver-backup-passphrase
                      key: passphrase
              volumeMounts:
                - name: mssql-data
                  mountPath: /var/opt/mssql
                - name: handoff
                  mountPath: /run/backup
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  GZ="$(cat /run/backup/path)"
                  ENC="$GZ.enc"

                  # -pass env: keeps the passphrase out of argv, where anything
                  # else on the node could read it out of /proc.
                  echo "== encrypting $(basename "$GZ") =="
                  openssl enc -aes-256-cbc -md sha512 -pbkdf2 -iter 600000 -salt \
                    -pass env:BACKUP_PASSPHRASE -in "$GZ" -out "$ENC"

                  # The plaintext must not outlive this step. $BACKUP_DIR is on
                  # the *live database's* volume, so a stray .gz is both a
                  # disclosure and a full-disk risk.
                  rm -f "$GZ"

                  # Round-trip the exact bytes that are about to be uploaded.
                  # This replaces the old `gzip -t` and is strictly stronger: it
                  # proves the object decrypts with the passphrase currently in
                  # the cluster, and that the gzip CRC still passes underneath.
                  # A backup nobody can decrypt is not a backup, and nothing
                  # downstream of here would notice.
                  echo "== verifying the encrypted stream round-trips =="
                  openssl enc -d -aes-256-cbc -md sha512 -pbkdf2 -iter 600000 \
                    -pass env:BACKUP_PASSPHRASE -in "$ENC" | gzip -t

                  echo "$ENC" > /run/backup/path
                  ls -la "$ENC"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "1"
                  memory: "512Mi"
          containers:
            - name: upload
              # aws-cli 2.36.30, released 2026-08-24 — newest at the time this
              # was written. Bump deliberately, not by floating on :latest.
              image: amazon/aws-cli:2.36.30@sha256:da37c08f8e00a64c09acd46e8ce5c3dd30b291046029def45566aa9ccd7b398b
              env:
                - name: AWS_REGION
                  value: "eu-central-1"
                - name: BUCKET
                  value: "kadis-ad77fef6-backups"
                - name: PREFIX
                  value: "sqlserver/platnik_migracja"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: sqlserver-backup-aws-creds
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sqlserver-backup-aws-creds
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: mssql-data
                  mountPath: /var/opt/mssql
                - name: handoff
                  mountPath: /run/backup
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  GZ="$(cat /run/backup/path)"

                  # Fires on success, failure and signal alike. A missed backup
                  # is recoverable; a full database volume is an outage.
                  # $GZ ends .bak.gz.enc now, so strip both suffixes — the
                  # old "${GZ%.gz}" silently matched nothing once encryption
                  # was added, leaving debris on the database volume.
                  trap 'rm -f "$GZ" "${GZ%.enc}" "${GZ%.gz.enc}"' EXIT

                  # Reuse the dump step's filename rather than rebuilding it
                  # from the database name and timestamp. It used to be spelled
                  # out again here, which meant the object key and the file on
                  # disk were two independent constructions of the same string —
                  # and renaming the database silently broke only one of them.
                  KEY="$PREFIX/$(basename "$GZ")"
                  echo "== uploading $GZ to s3://$BUCKET/$KEY =="
                  aws s3 cp "$GZ" "s3://$BUCKET/$KEY" --only-show-errors

                  # Confirm it's really there before we throw the local copy
                  # away — `aws s3 cp` exiting 0 is not the same as the object
                  # being readable.
                  SIZE="$(aws s3api head-object --bucket "$BUCKET" --key "$KEY" --query ContentLength --output text)"
                  echo "uploaded: s3://$BUCKET/$KEY ($SIZE bytes)"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "1"
                  memory: "512Mi"
