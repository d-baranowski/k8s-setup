# SA password for the SQL Server instance. The value lives in Google Secret
# Manager (secret id: sqlserver-sa-password) and never in this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sqlserver-sa-password
  namespace: sqlserver
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: google-secrets
  target:
    name: sqlserver-sa-password
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        password: "{{ .password | trim }}"
  data:
    - secretKey: password
      remoteRef:
        key: sqlserver-sa-password
        version: latest
