# Brokuł's own Flux Kustomization.
#
# dependsOn is not decoration. The Postgres operator has to have created the
# `brokul` database and its credentials Secret before the migrate Job can run,
# and external-secrets-resources has to have registered the ClusterSecretStore
# before any ExternalSecret here can resolve. Without the ordering the first
# reconcile fails on missing secrets and retries until it happens to win.
#
# prune: true — a resource removed from the kustomization is deleted from the
# cluster. That is the behaviour that makes this directory the source of truth;
# it is also why an accidental deletion here is a real deletion there.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: brokul
  namespace: flux-system
spec:
  dependsOn:
    - { name: pg-operator, namespace: flux-system }
    - { name: external-secrets-resources, namespace: flux-system }
  interval: 10m
  path: ./clusters/may-chang/brokul
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
