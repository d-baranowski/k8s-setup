apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  dependsOn:
    # The admin password, the Redis password, the restic password and the
    # backup bucket's AWS keys all come from the google-secrets
    # ClusterSecretStore.
    - name: external-secrets-resources
      namespace: flux-system
    # nextcloud's Postgres role and database are declared in pg-operator's
    # cluster.yaml, and the operator is what creates the credentials secret this
    # namespace reads.
    - name: pg-operator
      namespace: flux-system
    # The Ingress needs the `tailscale` IngressClass the operator registers.
    - name: tailscale-operator
      namespace: flux-system
  interval: 10m
  path: ./clusters/may-chang/nextcloud
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
