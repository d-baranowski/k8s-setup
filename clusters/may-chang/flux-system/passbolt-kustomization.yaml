apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passbolt
  namespace: flux-system
spec:
  dependsOn:
    # The GPG server key, the salt and the SMTP password all come from the
    # google-secrets ClusterSecretStore.
    - name: external-secrets-resources
      namespace: flux-system
    # passbolt's Postgres role and database are declared in pg-operator's
    # cluster.yaml, and the operator is what creates the credentials secret this
    # namespace reads.
    - name: pg-operator
      namespace: flux-system
    # The Ingress needs the `tailscale` IngressClass the operator registers.
    - name: tailscale-operator
      namespace: flux-system
  interval: 10m
  path: ./clusters/may-chang/passbolt
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
